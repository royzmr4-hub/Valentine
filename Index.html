<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO MART</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#080808;
color:white;

}


header{

display:flex;
justify-content:space-between;
align-items:center;

padding:20px 7%;

background:#111;

border-bottom:1px solid #333;

}


.logo{

font-size:30px;
font-weight:bold;

}

.logo span{

color:red;

}


button{

background:red;
color:white;

border:none;

padding:12px 20px;

border-radius:8px;

cursor:pointer;

}


.hero{

padding:100px 7%;

background:
linear-gradient(
90deg,
black,
transparent
),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");

background-size:cover;

}


.hero h1{

font-size:70px;

}


.hero span{

color:red;

}


section{

padding:50px 7%;

}


input{

background:#111;

border:1px solid #444;

color:white;

padding:15px;

border-radius:8px;

margin:5px;

}


.products{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}


.card{

background:#151515;

padding:20px;

border-radius:15px;

}


.card img{

width:100%;

height:200px;

object-fit:cover;

border-radius:10px;

}


.price{

color:red;

font-size:22px;

margin:15px 0;

}


.cart{

position:fixed;

right:0;

top:0;

width:350px;

height:100%;

background:#111;

padding:25px;

display:none;

}


.cart.show{

display:block;

}


</style>

</head>



<body>



<header>


<div class="logo">
AUTO <span>MART</span>
</div>


<button onclick="openCart()">
🛒 Сагс
</button>


</header>




<div class="hero">

<h1>
МАШИНАА<br>
<span>ЧИМЭГЛЭ</span>
</h1>

<p>
Машины гоёл аксессуарын онлайн дэлгүүр
</p>


</div>






<section>


<h2>
Бараанууд
</h2>


<input 
id="search"
placeholder="Бараа хайх..."
onkeyup="searchProduct()"
>



<div class="products" id="products">

</div>


</section>







<section>


<h2>
Хэрэглэгчийн хэсэг
</h2>


<input id="email"
placeholder="Email">


<input 
id="password"
type="password"
placeholder="Password"
>



<br>


<button onclick="register()">
Бүртгүүлэх
</button>


<button onclick="login()">
Нэвтрэх
</button>


<button onclick="logout()">
Гарах
</button>


</section>








<section>


<h2>
Админ бараа нэмэх
</h2>


<input id="pname"
placeholder="Барааны нэр">


<input id="pprice"
placeholder="Үнэ">


<input id="pdesc"
placeholder="Тайлбар">


<button onclick="addProduct()">

Бараа нэмэх

</button>


</section>







<div class="cart" id="cart">


<h2>
Миний сагс
</h2>


<div id="cartItems"></div>


<button onclick="closeCart()">
Хаах
</button>


</div>







<script type="module">



import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";



import {

getAuth,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

signOut

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



import {

getFirestore,

collection,

addDoc,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";






const firebaseConfig = {


apiKey:
"AIzaSyC240KaaBOaG-FIOmbJYRtGog8_uBqJ3OU",


authDomain:
"automart-5904d.firebaseapp.com",


projectId:
"automart-5904d",


storageBucket:
"automart-5904d.firebasestorage.app",


messagingSenderId:
"242016352799",


appId:
"1:242016352799:web:51dbdc908d562e3482732a"


};






const app =
initializeApp(firebaseConfig);



const auth =
getAuth(app);



const db =
getFirestore(app);






let products=[];

let cart=[];





// Бүртгэл


window.register = async()=>{


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



try{


await createUserWithEmailAndPassword(

auth,

email,

password

);


alert("Бүртгэл амжилттай");


}

catch(e){

alert(e.message);

}


};








// Нэвтрэх


window.login = async()=>{


try{


await signInWithEmailAndPassword(

auth,

email.value,

password.value

);



alert("Нэвтэрлээ");


}

catch(e){

alert(e.message);

}


};






// Гарах


window.logout=async()=>{


await signOut(auth);


alert("Гарлаа");


};








// Бараа нэмэх


window.addProduct=async()=>{


await addDoc(

collection(db,"products"),


{


name:pname.value,


price:Number(pprice.value),


description:pdesc.value


}


);



alert("Бараа нэмэгдлээ");


};








// Бараа авах


async function loadProducts(){


let data =
await getDocs(
collection(db,"products")
);



products=[];



data.forEach(doc=>{


products.push(doc.data());


});



showProducts(products);


}








function showProducts(list){


productsBox.innerHTML="";



list.forEach((p,index)=>{


productsBox.innerHTML+=`


<div class="card">


<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7">


<h3>${p.name}</h3>


<p>${p.description}</p>


<div class="price">

${p.price} ₮

</div>


<button onclick="addCart(${index})">

Сагсанд нэмэх

</button>


</div>


`;


});


}







window.searchProduct=()=>{


let text =
search.value.toLowerCase();



showProducts(

products.filter(

p=>

p.name.toLowerCase()
.includes(text)

)

);


};






window.addCart=(i)=>{


cart.push(products[i]);


alert("Сагсанд нэмэгдлээ");


};






window.openCart=()=>{


cartBox.classList.add("show");


cartItems.innerHTML="";



cart.forEach(x=>{


cartItems.innerHTML+=`

<p>
${x.name}
-
${x.price} ₮
</p>

`;


});


};




window.closeCart=()=>{


cartBox.classList.remove("show");


};






const productsBox =
document.getElementById("products");


const cartBox =
document.getElementById("cart");


const cartItems =
document.getElementById("cartItems");



loadProducts();



</script>



</body>

</html>
