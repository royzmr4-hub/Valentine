<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PinkFit AI 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg,#fff1f8,#ffe0ef);
  color: #54243f;
}

header {
  text-align: center;
  padding: 30px 20px;
  background: linear-gradient(135deg,#ff78b8,#ffafd6);
  color: white;
  border-radius: 0 0 30px 30px;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin-bottom: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 25px;
  box-shadow: 0 8px 25px rgba(200,70,130,.12);
}

h2 {
  color: #d74791;
}

input[type="file"] {
  width: 100%;
  padding: 15px;
  border: 2px dashed #f09bc5;
  border-radius: 15px;
  background: #fff8fc;
}

.categories {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin-top: 15px;
}

.categories button {
  border: 0;
  padding: 13px 5px;
  border-radius: 14px;
  background: #ffe1ef;
  color: #a52c68;
  font-weight: bold;
}

.categories button.active {
  background: #e95b9e;
  color: white;
}

.main-btn {
  width: 100%;
  border: 0;
  padding: 16px;
  margin-top: 15px;
  border-radius: 16px;
  background: linear-gradient(135deg,#ed62a5,#d83d89);
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.wardrobe {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.item {
  background: #fff0f7;
  border-radius: 17px;
  overflow: hidden;
  text-align: center;
}

.item img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.item p {
  margin: 8px;
  font-weight: bold;
}

.mannequin-area {
  width: 280px;
  height: 450px;
  margin: 20px auto;
  position: relative;
}

.man {
  position: absolute;
  left: 70px;
  bottom: 0;
  width: 140px;
  height: 420px;
}

.head {
  position: absolute;
  top: 5px;
  left: 45px;
  width: 50px;
  height: 60px;
  background: #f5c5b2;
  border-radius: 50%;
}

.hair {
  position: absolute;
  top: 0;
  left: 35px;
  width: 70px;
  height: 90px;
  background: #5b3042;
  border-radius: 45px;
}

.body {
  position: absolute;
  top: 65px;
  left: 25px;
  width: 90px;
  height: 175px;
  background: #f5c5b2;
  border-radius: 40px;
}

.leg {
  position: absolute;
  top: 225px;
  width: 35px;
  height: 175px;
  background: #f5c5b2;
  border-radius: 20px;
}

.left-leg {
  left: 38px;
}

.right-leg {
  right: 38px;
}

.clothes {
  position: absolute;
  z-index: 5;
  display: none;
  object-fit: contain;
}

.top {
  top: 65px;
  left: 10px;
  width: 120px;
  height: 160px;
}

.bottom {
  top: 190px;
  left: 15px;
  width: 110px;
  height: 170px;
}

.outer {
  top: 60px;
  left: 5px;
  width: 130px;
  height: 200px;
  opacity: .85;
}

.shoe {
  position: absolute;
  z-index: 6;
  display: none;
  width: 60px;
  height: 50px;
  object-fit: contain;
  bottom: 0;
}

.shoe1 {
  left: 5px;
}

.shoe2 {
  right: 5px;
}

.result {
  text-align: center;
}

@media(max-width:600px) {
  .categories {
    grid-template-columns: repeat(2,1fr);
  }

  .wardrobe {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🎀 PinkFit AI</h1>
  <p>Өөрийн хувцсаар өөрийн style-аа бүтээ 💗</p>
</header>

<div class="container">

<div class="card">

<h2>👗 Хувцас нэмэх</h2>

<input
  type="file"
  id="photo"
  accept="image/*"
>

<div class="categories">

<button class="active" data-cat="top">
👚 Цамц
</button>

<button data-cat="bottom">
👖 Өмд
</button>

<button data-cat="shoes">
👠 Гутал
</button>

<button data-cat="outerwear">
🧥 Гадуур
</button>

</div>

<button class="main-btn" onclick="addClothes()">
💗 AI-аар таньж нэмэх
</button>

<p id="status"></p>

</div>


<div class="card">

<h2>👜 My Wardrobe</h2>

<div id="wardrobe" class="wardrobe"></div>

</div>


<div class="card">

<h2>✨ AI Try-On</h2>

<button class="main-btn" onclick="makeOutfit()">
🎀 AI Outfit үүсгэх
</button>

<div class="mannequin-area">

<div class="man">

<div class="hair"></div>
<div class="head"></div>
<div class="body"></div>

<div class="leg left-leg"></div>
<div class="leg right-leg"></div>

<img id="outer" class="clothes outer">

<img id="top" class="clothes top">

<img id="bottom" class="clothes bottom">

<img id="shoe1" class="shoe shoe1">

<img id="shoe2" class="shoe shoe2">

</div>

</div>

<div id="result" class="result"></div>

</div>

</div>


<script>

let wardrobe =
JSON.parse(localStorage.getItem("pinkfit"))
|| [];

let selectedCategory = "top";


document.querySelectorAll(
  ".categories button"
).forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(
      ".categories button"
    ).forEach(b =>
      b.classList.remove("active")
    );

    button.classList.add("active");

    selectedCategory =
      button.dataset.cat;
  };

});


async function addClothes() {

  const file =
    document.getElementById("photo").files[0];

  if (!file) {
    alert("Хувцасны зураг сонгоно уу 💗");
    return;
  }

  const status =
    document.getElementById("status");

  status.innerText =
    "✨ AI зураг таньж байна...";


  const reader =
    new FileReader();

  reader.onload = async function(e) {

    try {

      const response =
        await fetch("/api/analyze", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            image: e.target.result
          })

        });


      const ai =
        await response.json();


      if (!response.ok) {
        throw new Error(ai.error);
      }


      wardrobe.push({

        image: e.target.result,

        category:
          ai.category || selectedCategory,

        color:
          ai.color || "",

        style:
          ai.style || "",

        occasion:
          ai.occasion || ""

      });


      localStorage.setItem(
        "pinkfit",
        JSON.stringify(wardrobe)
      );


      document.getElementById("photo").value = "";

      status.innerText =
        `💗 AI танилаа: ${ai.category} / ${ai.color}`;

      showWardrobe();

    } catch(error) {

      console.error(error);

      status.innerText =
        "😢 AI ажиллахгүй байна.";

    }

  };

  reader.readAsDataURL(file);

}


function showWardrobe() {

  const box =
    document.getElementById("wardrobe");

  box.innerHTML = "";

  if (wardrobe.length === 0) {

    box.innerHTML =
      "<p>Хувцаснуудаа нэмээрэй 💕</p>";

    return;
  }


  wardrobe.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `

      <img src="${item.image}">

      <p>${item.category}</p>

    `;

    box.appendChild(div);

  });

}


async function makeOutfit() {

  if (wardrobe.length < 3) {

    alert(
      "Дор хаяж 3 хувцас нэмээрэй 💗"
    );

    return;
  }


  document.getElementById("result")
    .innerText =
    "✨ AI outfit сонгож байна...";


  try {

    const response =
      await fetch("/api/outfit", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          clothes: wardrobe
        })

      });


    const outfit =
      await response.json();


    if (!response.ok) {
      throw new Error(outfit.error);
    }


    showOutfit(outfit);


  } catch(error) {

    console.error(error);

    document.getElementById("result")
      .innerText =
      "😢 AI outfit үүсгэж чадсангүй.";

  }

}


function showOutfit(outfit) {

  const top =
    wardrobe[outfit.top];

  const bottom =
    wardrobe[outfit.bottom];

  const shoes =
    wardrobe[outfit.shoes];


  setClothing(
    "top",
    top?.image
  );

  setClothing(
    "bottom",
    bottom?.image
  );


  setClothing(
    "shoe1",
    shoes?.image
  );

  setClothing(
    "shoe2",
    shoes?.image
  );


  const outer =
    outfit.outerwear !== null
      ? wardrobe[outfit.outerwear]
      : null;


  if (outer) {

    setClothing(
      "outer",
      outer.image
    );

  } else {

    document.getElementById("outer")
      .style.display = "none";

  }


  document.getElementById("result")
    .innerHTML = `

      <h3>🎀 AI Outfit бэлэн!</h3>

      <p>
        ${outfit.reason || "Чиний wardrobe-д тохирууллаа 💗"}
      </p>

    `;

}


function setClothing(id, src) {

  const element =
    document.getElementById(id);

  if (!src) {

    element.style.display =
      "none";

    return;
  }

  element.src = src;

  element.style.display =
    "block";

}


showWardrobe();

</script>

</body>
</html>
