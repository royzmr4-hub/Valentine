<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Төрсөн өдрийн мэнд</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      text-align:center;
      background:linear-gradient(180deg,#ffb3c6,#ffd6e0,#fff0f5);
      position:relative;
    }

    .balloon{
      position:absolute;
      bottom:-120px;
      width:55px;
      height:70px;
      border-radius:50%;
      animation:floatUp linear infinite;
      box-shadow:inset -6px -8px 0 rgba(0,0,0,0.08);
    }

    .balloon::before{
      content:"";
      position:absolute;
      bottom:-8px;
      left:50%;
      transform:translateX(-50%);
      width:10px;
      height:10px;
      background:inherit;
      clip-path:polygon(50% 100%, 0 0, 100% 0);
    }

    .balloon::after{
      content:"";
      position:absolute;
      top:68px;
      left:50%;
      transform:translateX(-50%);
      width:2px;
      height:70px;
      background:rgba(0,0,0,0.15);
    }

    .container{
      position:relative;
      z-index:2;
      padding:20px;
      animation:fadeIn 1.2s ease;
    }

    h1{
      color:#d6336c;
      font-size:38px;
      margin-bottom:10px;
      text-shadow:0 2px 8px rgba(255,255,255,0.8);
    }

    .sub{
      color:#7a4455;
      font-size:18px;
      margin-bottom:24px;
    }

    .cake-wrap{
      position:relative;
      width:280px;
      height:300px;
      margin:0 auto 18px;
      animation:cakeFloat 3s ease-in-out infinite;
    }

    .plate{
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      width:240px;
      height:22px;
      background:#ececec;
      border-radius:50%;
      box-shadow:0 6px 12px rgba(0,0,0,0.12);
    }

    .bottom-layer{
      position:absolute;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      width:210px;
      height:90px;
      background:linear-gradient(180deg,#ff7aa2,#ff4f87);
      border-radius:18px;
    }

    .top-layer{
      position:absolute;
      bottom:120px;
      left:50%;
      transform:translateX(-50%);
      width:140px;
      height:70px;
      background:linear-gradient(180deg,#ffb3c6,#ff7aa2);
      border-radius:16px;
    }

    .icing1, .icing2{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      background:#fff8fb;
      border-radius:16px;
    }

    .icing1{
      bottom:122px;
      width:210px;
      height:18px;
    }

    .icing2{
      bottom:188px;
      width:140px;
      height:16px;
    }

    .candle{
      position:absolute;
      bottom:190px;
      width:12px;
      height:40px;
      border-radius:8px;
      background:repeating-linear-gradient(
        45deg,
        #ffffff 0 6px,
        #ff5c8a 6px 12px
      );
    }

    .c1{ left:118px; }
    .c2{ left:150px; }

    .flame{
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:14px;
      height:20px;
      background:radial-gradient(circle at 50% 65%, #ffd166, #ff8c42 70%);
      border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      animation:flicker 0.8s infinite alternate;
      box-shadow:0 0 14px rgba(255,193,7,0.7);
    }

    .msg{
      color:#b03060;
      font-size:20px;
      font-weight:bold;
      line-height:1.6;
    }

    @keyframes floatUp{
      0%{ transform:translateY(0); }
      100%{ transform:translateY(-120vh); }
    }

    @keyframes cakeFloat{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }

    @keyframes flicker{
      0%{ transform:translateX(-50%) scale(1) rotate(-2deg); }
      100%{ transform:translateX(-50%) scale(1.12) rotate(2deg); }
    }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(18px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @media (max-width:600px){
      h1{ font-size:30px; }
      .sub{ font-size:16px; }
      .msg{ font-size:18px; }
      .cake-wrap{ transform:scale(0.95); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 Төрсөн өдрийн мэнд 🎉</h1>
    <div class="sub">Чамд хамгийн аз жаргалтай өдрийг хүсье 💖</div>

    <div class="cake-wrap">
      <div class="top-layer"></div>
      <div class="icing2"></div>

      <div class="candle c1"><div class="flame"></div></div>
      <div class="candle c2"><div class="flame"></div></div>

      <div class="bottom-layer"></div>
      <div class="icing1"></div>

      <div class="plate"></div>
    </div>

    <div class="msg">Happy Birthday 🎂</div>
  </div>

  <script>
    const colors = ["#ff6b81", "#ffd166", "#70c1b3", "#6c8cff", "#ff8fab", "#bdb2ff"];

    for (let i = 0; i < 14; i++) {
      const b = document.createElement("div");
      b.className = "balloon";
      b.style.left = Math.random() * 100 + "%";
      b.style.background = colors[i % colors.length];
      b.style.animationDuration = (6 + Math.random() * 5) + "s";
      b.style.animationDelay = Math.random() * 4 + "s";
      document.body.appendChild(b);
    }
  </script>

</body>
</html>
